app:
  admin:
    # En cualquier ambiente real esto viene de la variable de entorno ADMIN_CLAVE.
    # Proteccion interina por clave compartida (ver ADR del modulo de modulos-por-empresa).
    clave: ${ADMIN_CLAVE:solo-para-desarrollo-local-cambiar-siempre}
  jwt:
    # En cualquier ambiente real esto viene de la variable de entorno JWT_SECRET.
    # El valor de acá abajo es SOLO para que la app levante en una maquina local sin configurar nada -
    # nunca usar este valor en DEV compartido, QA o PROD.
    secret: ${JWT_SECRET:solo-para-desarrollo-local-cambiar-siempre}
    expiracion-minutos: 15
  consola:
    # Token de operador de la consola de operacion. Comparte app.jwt.secret pero
    # con forma propia (scope=plataforma, sin claim de empresa) y vida corta.
    jwt:
      expiracion-minutos: ${CONSOLA_JWT_MIN:15}
  cors:
    # Origenes permitidos separados por coma. Por defecto solo el dev server de
    # Angular (ng serve). En otros ambientes se sobreescribe con la variable de
    # entorno CORS_ALLOWED_ORIGINS (nunca usar "*", las peticiones van con credenciales).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  aprovisionamiento:
    sondeo-ms: ${APROV_SONDEO_MS:5000}
    plantilla: ${APROV_PLANTILLA:db_plantilla_maestra}
    sufijo-dominio: ${APROV_SUFIJO_DOMINIO:mb}
    cliente-host: ${APROV_CLIENTE_HOST:localhost}
    cliente-puerto: ${APROV_CLIENTE_PUERTO:5432}
    mantenimiento:
      url: ${APROV_MANT_URL:jdbc:postgresql://localhost:5432/postgres}
      username: ${APROV_MANT_USER:guajiranet_owner}
      password: ${APROV_MANT_PASSWORD:guajiranet_owner}


    # Separado por comas si hay mas de uno. En cualquier ambiente real
    # (QA, PROD) viene de la variable de entorno CORS_ORIGENES, con el
    # dominio real del frontend desplegado -- nunca localhost.
    origenes-permitidos: ${CORS_ORIGENES:http://localhost:4200}
    # Apagado por defecto -- sin esto, correr local sin configurar SMTP
    # tiraria un error de conexion confuso en vez de uno claro. Se prende
    # explicito (CORREO_HABILITADO=true) apenas haya credenciales SMTP reales.
    habilitado: ${CORREO_HABILITADO:false}
spring:
  application:
    name: marca-blanca-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_portal_guajiranet_control}
    username: ${SPRING_DATASOURCE_USERNAME:guajiranet_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:guajiranet_owner}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/control/db.changelog-master.yaml
    parameters:
      # Correo del primer operador que siembra el changeset 0020 (tiene un
      # default propio; esto solo permite sobreescribirlo por variable de entorno).
      "[consola.superadmin.correo]": ${CONSOLA_SUPERADMIN_CORREO:admin@guajiranet.com}

  docker:
    compose:
      lifecycle-management: start-and-stop