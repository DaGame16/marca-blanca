databaseChangeLog:
  - changeSet:
      id: 0007-seguridad-crear-tabla-permisos-de-rol
      author: leidi
      comment: Pivote rol <-> permiso (M:N).
      changes:
        - createTable:
            schemaName: seguridad
            tableName: TBL_permisos_de_rol
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_permisos_de_rol
              - column:
                  name: uuid
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: UQ_permisos_de_rol_uuid
              - column:
                  name: rol_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_permisos_de_rol_rol
                    references: seguridad.TBL_roles(id)
              - column:
                  name: permiso_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_permisos_de_rol_permiso
                    references: seguridad.TBL_permisos(id)
              - column:
                  name: asignado_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            schemaName: seguridad
            tableName: TBL_permisos_de_rol
            columnNames: rol_id, permiso_id
            constraintName: UQ_permisos_de_rol_par
        - createIndex:
            schemaName: seguridad
            tableName: TBL_permisos_de_rol
            indexName: IDX_permisos_de_rol_permiso_id
            columns:
              - column:
                  name: permiso_id
      rollback:
        - dropTable:
            schemaName: seguridad
            tableName: TBL_permisos_de_rol