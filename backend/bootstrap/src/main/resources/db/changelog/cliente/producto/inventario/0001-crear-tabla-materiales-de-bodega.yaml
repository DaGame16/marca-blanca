databaseChangeLog:
  - changeSet:
      id: producto-inventario-0001-crear-tabla-materiales-de-bodega
      author: leidi
      comment: Existencia de material por bodega. Sin empresaId; unico por (bodega, material).
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_materiales_de_bodega
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_materiales_de_bodega}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_materiales_de_bodega_uuid}}
              - column:
                  name: bodega_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_materiales_de_bodega_bodega, references: producto.tbl_bodegas(id)}
              - column:
                  name: producto_id
                  type: BIGINT
                  constraints: {foreignKeyName: fk_materiales_de_bodega_producto, references: producto.tbl_productos(id)}
              - column: {name: material, type: VARCHAR(191), constraints: {nullable: false}}
              - column: {name: cantidad, type: DOUBLE PRECISION, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: metros, type: DOUBLE PRECISION, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: creado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
              - column: {name: actualizado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
        - addUniqueConstraint:
            schemaName: producto
            tableName: tbl_materiales_de_bodega
            columnNames: bodega_id, material
            constraintName: uq_materiales_de_bodega_par
        - createIndex: {schemaName: producto, tableName: tbl_materiales_de_bodega, indexName: idx_materiales_de_bodega_producto_id, columns: [{column: {name: producto_id}}]}
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_materiales_de_bodega}
