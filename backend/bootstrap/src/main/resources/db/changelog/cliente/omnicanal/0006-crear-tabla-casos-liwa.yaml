databaseChangeLog:
  - changeSet:
      id: 0020-omnicanal-crear-tabla-casos-liwa
      author: leidi
      comment: Casos Liwa - segmento de una conversacion marcado para analisis.
      changes:
        - createTable:
            schemaName: omnicanal
            tableName: tbl_casos_liwa
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_casos_liwa
              - column:
                  name: uuid
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_casos_liwa_uuid
              - column:
                  name: conversacion_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_casos_liwa_conversacion
                    references: omnicanal.tbl_conversaciones_liwa(id)
              - column:
                  name: turno_orden_inicio
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: turno_orden_fin
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: es_procesada
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: es_de_ads
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: archivada_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: omnicanal
            tableName: tbl_casos_liwa
            indexName: idx_casos_liwa_conversacion_id
            columns:
              - column:
                  name: conversacion_id
      rollback:
        - dropTable:
            schemaName: omnicanal
            tableName: tbl_casos_liwa
