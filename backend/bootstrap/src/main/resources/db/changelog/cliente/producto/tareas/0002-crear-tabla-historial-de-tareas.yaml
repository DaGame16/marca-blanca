databaseChangeLog:
  - changeSet:
      id: producto-tareas-0002-crear-tabla-historial-de-tareas
      author: leidi
      comment: Historial de cambios de una tarea. estado_anterior/estado_nuevo (enums) como VARCHAR + CHECK.
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_historial_de_tareas
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_historial_de_tareas}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_historial_de_tareas_uuid}}
              - column:
                  name: tarea_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_historial_de_tareas_tarea, references: producto.tbl_tareas(id)}
              - column: {name: accion, type: VARCHAR(120), constraints: {nullable: false}}
              - column: {name: tipo_objetivo, type: VARCHAR(100)}
              - column:
                  name: de_usuario_id
                  type: BIGINT
                  constraints: {foreignKeyName: fk_historial_de_tareas_de_usuario, references: seguridad.tbl_usuarios(id)}
              - column:
                  name: a_usuario_id
                  type: BIGINT
                  constraints: {foreignKeyName: fk_historial_de_tareas_a_usuario, references: seguridad.tbl_usuarios(id)}
              - column:
                  name: de_cuadrilla_id
                  type: BIGINT
                  constraints: {foreignKeyName: fk_historial_de_tareas_de_cuadrilla, references: producto.tbl_cuadrillas(id)}
              - column:
                  name: a_cuadrilla_id
                  type: BIGINT
                  constraints: {foreignKeyName: fk_historial_de_tareas_a_cuadrilla, references: producto.tbl_cuadrillas(id)}
              - column: {name: estado_anterior, type: VARCHAR(20)}
              - column: {name: estado_nuevo, type: VARCHAR(20)}
              - column: {name: notas, type: VARCHAR(191)}
              - column:
                  name: realizado_por_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_historial_de_tareas_realizado_por, references: seguridad.tbl_usuarios(id)}
              - column: {name: creado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
        - sql:
            sql: >
              ALTER TABLE producto.tbl_historial_de_tareas ADD CONSTRAINT ck_historial_de_tareas_estados
              CHECK (
                (estado_anterior IS NULL OR estado_anterior IN ('PENDIENTE','VALIDACION','EN_PROGRESO','COMPLETADA','CANCELADA','PAUSADA'))
                AND (estado_nuevo IS NULL OR estado_nuevo IN ('PENDIENTE','VALIDACION','EN_PROGRESO','COMPLETADA','CANCELADA','PAUSADA'))
              )
        - createIndex: {schemaName: producto, tableName: tbl_historial_de_tareas, indexName: idx_historial_de_tareas_tarea_id, columns: [{column: {name: tarea_id}}]}
        - createIndex: {schemaName: producto, tableName: tbl_historial_de_tareas, indexName: idx_historial_de_tareas_realizado_por_id, columns: [{column: {name: realizado_por_id}}]}
        - createIndex: {schemaName: producto, tableName: tbl_historial_de_tareas, indexName: idx_historial_de_tareas_de_usuario_id, columns: [{column: {name: de_usuario_id}}]}
        - createIndex: {schemaName: producto, tableName: tbl_historial_de_tareas, indexName: idx_historial_de_tareas_a_usuario_id, columns: [{column: {name: a_usuario_id}}]}
        - createIndex: {schemaName: producto, tableName: tbl_historial_de_tareas, indexName: idx_historial_de_tareas_de_cuadrilla_id, columns: [{column: {name: de_cuadrilla_id}}]}
        - createIndex: {schemaName: producto, tableName: tbl_historial_de_tareas, indexName: idx_historial_de_tareas_a_cuadrilla_id, columns: [{column: {name: a_cuadrilla_id}}]}
        - createIndex: {schemaName: producto, tableName: tbl_historial_de_tareas, indexName: idx_historial_de_tareas_creado_en, columns: [{column: {name: creado_en}}]}
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_historial_de_tareas}
