databaseChangeLog:
  - changeSet:
      id: producto-ventas-0008-crear-tablas-facturas
      author: leidi
      comment: Facturas (1:1 con remision) y sus items. Sin empresaId; consecutivo unico por base.
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_facturas
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_facturas}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_facturas_uuid}}
              - column: {name: consecutivo, type: INTEGER, constraints: {nullable: false, unique: true, uniqueConstraintName: uq_facturas_consecutivo}}
              - column:
                  name: remision_id
                  type: BIGINT
                  constraints: {nullable: false, unique: true, uniqueConstraintName: uq_facturas_remision, foreignKeyName: fk_facturas_remision, references: producto.tbl_remisiones(id)}
              - column:
                  name: creado_por_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_facturas_creado_por, references: seguridad.tbl_usuarios(id)}
              - column: {name: cufe, type: VARCHAR(191)}
              - column: {name: subtotal, type: "NUMERIC(18,2)", constraints: {nullable: false}}
              - column: {name: impuestos, type: "NUMERIC(18,2)", constraints: {nullable: false}}
              - column: {name: total, type: "NUMERIC(18,2)", constraints: {nullable: false}}
              - column: {name: facturada_en, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: creado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
        - createIndex: {schemaName: producto, tableName: tbl_facturas, indexName: idx_facturas_creado_por_id, columns: [{column: {name: creado_por_id}}]}
        - createTable:
            schemaName: producto
            tableName: tbl_items_de_factura
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_items_de_factura}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_items_de_factura_uuid}}
              - column:
                  name: factura_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_items_de_factura_factura, references: producto.tbl_facturas(id)}
              - column:
                  name: producto_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_items_de_factura_producto, references: producto.tbl_productos(id)}
              - column: {name: cantidad, type: "NUMERIC(18,4)", constraints: {nullable: false}}
              - column: {name: precio_unitario, type: "NUMERIC(18,2)", constraints: {nullable: false}}
        - createIndex: {schemaName: producto, tableName: tbl_items_de_factura, indexName: idx_items_de_factura_factura_id, columns: [{column: {name: factura_id}}]}
        - createIndex: {schemaName: producto, tableName: tbl_items_de_factura, indexName: idx_items_de_factura_producto_id, columns: [{column: {name: producto_id}}]}
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_items_de_factura}
        - dropTable: {schemaName: producto, tableName: tbl_facturas}
