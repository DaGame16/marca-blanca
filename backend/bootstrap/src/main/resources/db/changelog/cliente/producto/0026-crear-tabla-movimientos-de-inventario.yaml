databaseChangeLog:
  - changeSet:
      id: producto-0026-crear-tabla-movimientos-de-inventario
      author: leidi
      comment: Kardex de movimientos de inventario. tipo (enum) como VARCHAR + CHECK. recepcion_id/remision_id/devolucion_id sin FK hasta la ola de compras.
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_movimientos_de_inventario
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_movimientos_de_inventario}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_movimientos_de_inventario_uuid}}
              - column:
                  name: producto_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_movimientos_de_inventario_producto, references: producto.tbl_productos(id)}
              - column:
                  name: bodega_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_movimientos_de_inventario_bodega, references: producto.tbl_bodegas(id)}
              - column:
                  name: responsable_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_movimientos_de_inventario_responsable, references: seguridad.tbl_usuarios(id)}
              - column: {name: tipo, type: VARCHAR(30), constraints: {nullable: false}}
              - column: {name: cantidad, type: "NUMERIC(18,4)", constraints: {nullable: false}}
              - column: {name: recepcion_id, type: BIGINT}
              - column: {name: remision_id, type: BIGINT}
              - column: {name: devolucion_id, type: BIGINT}
              - column: {name: movido_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
              - column: {name: creado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
        - sql:
            sql: >
              ALTER TABLE producto.tbl_movimientos_de_inventario ADD CONSTRAINT ck_movimientos_de_inventario_tipo
              CHECK (tipo IN ('ENTRADA_COMPRA','ENTRADA_LEGALIZACION','SALIDA_REMISION','ENTRADA_DEVOLUCION_CLIENTE','SALIDA_DEVOLUCION_PROVEEDOR','AJUSTE_ENTRADA','AJUSTE_SALIDA','CARGA_INICIAL'))
        - createIndex: {schemaName: producto, tableName: tbl_movimientos_de_inventario, indexName: idx_movimientos_de_inventario_producto_id, columns: [{column: {name: producto_id}}]}
        - createIndex: {schemaName: producto, tableName: tbl_movimientos_de_inventario, indexName: idx_movimientos_de_inventario_bodega_id, columns: [{column: {name: bodega_id}}]}
        - createIndex: {schemaName: producto, tableName: tbl_movimientos_de_inventario, indexName: idx_movimientos_de_inventario_responsable_id, columns: [{column: {name: responsable_id}}]}
        - createIndex: {schemaName: producto, tableName: tbl_movimientos_de_inventario, indexName: idx_movimientos_de_inventario_recepcion_id, columns: [{column: {name: recepcion_id}}]}
        - createIndex: {schemaName: producto, tableName: tbl_movimientos_de_inventario, indexName: idx_movimientos_de_inventario_remision_id, columns: [{column: {name: remision_id}}]}
        - createIndex: {schemaName: producto, tableName: tbl_movimientos_de_inventario, indexName: idx_movimientos_de_inventario_devolucion_id, columns: [{column: {name: devolucion_id}}]}
        - createIndex:
            schemaName: producto
            tableName: tbl_movimientos_de_inventario
            indexName: idx_movimientos_de_inventario_producto_movido
            columns: [{column: {name: producto_id}}, {column: {name: movido_en}}]
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_movimientos_de_inventario}
