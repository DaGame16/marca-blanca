databaseChangeLog:
  - changeSet:
      id: producto-tareas-0009-crear-tabla-mensajes-de-tarea
      author: leidi
      comment: Mensajes de la conversacion de una tarea (tabla "mensajes" del viejo). remitente FK a seguridad.tbl_usuarios.
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_mensajes_de_tarea
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_mensajes_de_tarea}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_mensajes_de_tarea_uuid}}
              - column:
                  name: tarea_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_mensajes_de_tarea_tarea, references: producto.tbl_tareas(id)}
              - column:
                  name: remitente_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_mensajes_de_tarea_remitente, references: seguridad.tbl_usuarios(id)}
              - column: {name: contenido, type: TEXT, constraints: {nullable: false}}
              - column: {name: creado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
        - createIndex: {schemaName: producto, tableName: tbl_mensajes_de_tarea, indexName: idx_mensajes_de_tarea_tarea_id, columns: [{column: {name: tarea_id}}]}
        - createIndex: {schemaName: producto, tableName: tbl_mensajes_de_tarea, indexName: idx_mensajes_de_tarea_remitente_id, columns: [{column: {name: remitente_id}}]}
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_mensajes_de_tarea}
