databaseChangeLog:
  - changeSet:
      id: producto-0002-crear-tabla-categorias-de-producto
      author: leidi
      comment: Catalogo de categorias de producto. Sin empresaId; nombre unico por base.
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_categorias_de_producto
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_categorias_de_producto}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_categorias_de_producto_uuid}}
              - column: {name: nombre, type: VARCHAR(150), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_categorias_de_producto_nombre}}
              - column: {name: descripcion, type: VARCHAR(255)}
              - column: {name: es_activa, type: BOOLEAN, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: creado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
              - column: {name: actualizado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_categorias_de_producto}
