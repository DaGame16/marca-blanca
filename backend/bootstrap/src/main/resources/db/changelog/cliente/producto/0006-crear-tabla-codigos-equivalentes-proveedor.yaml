databaseChangeLog:
  - changeSet:
      id: producto-0006-crear-tabla-codigos-equivalentes-proveedor
      author: leidi
      comment: Codigo de un producto segun cada proveedor. Unico por (proveedor, codigo_proveedor).
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_codigos_equivalentes_proveedor
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_codigos_equivalentes_proveedor}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_codigos_equivalentes_proveedor_uuid}}
              - column:
                  name: producto_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_codigos_equiv_prov_producto, references: producto.tbl_productos(id)}
              - column:
                  name: proveedor_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_codigos_equiv_prov_proveedor, references: producto.tbl_proveedores(id)}
              - column: {name: codigo_proveedor, type: VARCHAR(100), constraints: {nullable: false}}
              - column: {name: descripcion_proveedor, type: VARCHAR(255)}
              - column: {name: estado, type: VARCHAR(20), defaultValue: ACTIVO, constraints: {nullable: false}}
              - column: {name: creado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
              - column: {name: actualizado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
        - addUniqueConstraint:
            schemaName: producto
            tableName: tbl_codigos_equivalentes_proveedor
            columnNames: proveedor_id, codigo_proveedor
            constraintName: uq_codigos_equivalentes_proveedor_par
        - sql:
            sql: >
              ALTER TABLE producto.tbl_codigos_equivalentes_proveedor ADD CONSTRAINT ck_codigos_equivalentes_proveedor_estado
              CHECK (estado IN ('ACTIVO','INACTIVO'))
        - createIndex:
            schemaName: producto
            tableName: tbl_codigos_equivalentes_proveedor
            indexName: idx_codigos_equiv_prov_producto_id
            columns: [{column: {name: producto_id}}]
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_codigos_equivalentes_proveedor}
