databaseChangeLog:
  - changeSet:
      id: producto-catalogos-0007-crear-tabla-nodos
      author: leidi
      comment: Nodos de red / puntos fisicos. Sin empresaId.
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_nodos
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_nodos}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_nodos_uuid}}
              - column: {name: nombre, type: VARCHAR(191), constraints: {nullable: false}}
              - column: {name: codigo, type: VARCHAR(100)}
              - column: {name: tipo, type: VARCHAR(100)}
              - column: {name: descripcion, type: TEXT}
              - column: {name: direccion, type: VARCHAR(255)}
              - column: {name: municipio, type: VARCHAR(120)}
              - column: {name: departamento, type: VARCHAR(120)}
              - column: {name: latitud, type: DOUBLE PRECISION}
              - column: {name: longitud, type: DOUBLE PRECISION}
              - column: {name: ubicacion_actualizada_en, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: creado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
              - column: {name: actualizado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_nodos}
