databaseChangeLog:
  - changeSet:
      id: producto-0011-crear-tabla-cuadrillas
      author: leidi
      comment: Cuadrillas de tecnicos. Sin empresaId; nombre unico por base. coordinador/lider FK a seguridad.tbl_usuarios.
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_cuadrillas
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_cuadrillas}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_cuadrillas_uuid}}
              - column: {name: nombre, type: VARCHAR(150), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_cuadrillas_nombre}}
              - column: {name: zona, type: VARCHAR(120), constraints: {nullable: false}}
              - column:
                  name: coordinador_id
                  type: BIGINT
                  constraints: {foreignKeyName: fk_cuadrillas_coordinador, references: seguridad.tbl_usuarios(id)}
              - column:
                  name: lider_id
                  type: BIGINT
                  constraints: {foreignKeyName: fk_cuadrillas_lider, references: seguridad.tbl_usuarios(id)}
              - column: {name: creado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
              - column: {name: actualizado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
        - createIndex:
            schemaName: producto
            tableName: tbl_cuadrillas
            indexName: idx_cuadrillas_coordinador_id
            columns: [{column: {name: coordinador_id}}]
        - createIndex:
            schemaName: producto
            tableName: tbl_cuadrillas
            indexName: idx_cuadrillas_lider_id
            columns: [{column: {name: lider_id}}]
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_cuadrillas}
