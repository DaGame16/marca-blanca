databaseChangeLog:
  - changeSet:
      id: producto-0004-crear-tabla-productos
      author: leidi
      comment: Productos. Sin empresaId; codigo_interno unico por base. estado (enum del viejo) como VARCHAR + CHECK.
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_productos
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_productos}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_productos_uuid}}
              - column: {name: codigo_interno, type: VARCHAR(100), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_productos_codigo_interno}}
              - column: {name: nombre, type: VARCHAR(191), constraints: {nullable: false}}
              - column: {name: descripcion, type: TEXT}
              - column: {name: marca, type: VARCHAR(120)}
              - column: {name: modelo, type: VARCHAR(120)}
              - column: {name: estado, type: VARCHAR(20), defaultValue: ACTIVO, constraints: {nullable: false}}
              - column:
                  name: categoria_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_productos_categoria, references: producto.tbl_categorias_de_producto(id)}
              - column:
                  name: unidad_medida_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_productos_unidad_medida, references: producto.tbl_unidades_de_medida(id)}
              - column:
                  name: bodega_predeterminada_id
                  type: BIGINT
                  constraints: {foreignKeyName: fk_productos_bodega_predeterminada, references: producto.tbl_bodegas(id)}
              - column: {name: existencia_minima, type: "NUMERIC(18,4)", defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: existencia_maxima, type: "NUMERIC(18,4)", defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: costo_promedio, type: "NUMERIC(18,4)", defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: creado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
              - column: {name: actualizado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
        - sql:
            sql: >
              ALTER TABLE producto.tbl_productos ADD CONSTRAINT ck_productos_estado
              CHECK (estado IN ('ACTIVO','INACTIVO','DESCONTINUADO','BLOQUEADO_COMPRA','BLOQUEADO_VENTA'))
        - createIndex:
            schemaName: producto
            tableName: tbl_productos
            indexName: idx_productos_categoria_id
            columns: [{column: {name: categoria_id}}]
        - createIndex:
            schemaName: producto
            tableName: tbl_productos
            indexName: idx_productos_unidad_medida_id
            columns: [{column: {name: unidad_medida_id}}]
        - createIndex:
            schemaName: producto
            tableName: tbl_productos
            indexName: idx_productos_bodega_predeterminada_id
            columns: [{column: {name: bodega_predeterminada_id}}]
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_productos}
