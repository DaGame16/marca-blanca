databaseChangeLog:
  - changeSet:
      id: seguridad-0008-crear-tabla-sesiones
      author: leidi
      comment: Sesiones activas. tokenRefresco del viejo se guarda hasheado; direccion_ip como INET.
      changes:
        - createTable:
            schemaName: seguridad
            tableName: tbl_sesiones
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_sesiones
              - column:
                  name: uuid
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_sesiones_uuid
              - column:
                  name: usuario_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_sesiones_usuario
                    references: seguridad.tbl_usuarios(id)
              - column:
                  name: info_dispositivo
                  type: VARCHAR(255)
              - column:
                  name: direccion_ip
                  type: INET
              - column:
                  name: hash_token_refresco
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: expira_en
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: creado_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: seguridad
            tableName: tbl_sesiones
            indexName: idx_sesiones_usuario_id
            columns:
              - column:
                  name: usuario_id
        - createIndex:
            schemaName: seguridad
            tableName: tbl_sesiones
            indexName: idx_sesiones_expira_en
            columns:
              - column:
                  name: expira_en
      rollback:
        - dropTable:
            schemaName: seguridad
            tableName: tbl_sesiones