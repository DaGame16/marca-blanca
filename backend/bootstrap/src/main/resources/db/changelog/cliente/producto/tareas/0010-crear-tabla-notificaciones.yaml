databaseChangeLog:
  - changeSet:
      id: producto-tareas-0010-crear-tabla-notificaciones
      author: leidi
      comment: Notificaciones a usuarios, opcionalmente ligadas a una tarea o a un canal de chat. id_canal/tipo_canal son referencias sueltas (sin FK).
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_notificaciones
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_notificaciones}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_notificaciones_uuid}}
              - column:
                  name: usuario_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_notificaciones_usuario, references: seguridad.tbl_usuarios(id)}
              - column:
                  name: tarea_id
                  type: BIGINT
                  constraints: {foreignKeyName: fk_notificaciones_tarea, references: producto.tbl_tareas(id)}
              - column: {name: titulo, type: VARCHAR(191), constraints: {nullable: false}}
              - column: {name: mensaje, type: VARCHAR(500), constraints: {nullable: false}}
              - column: {name: id_canal, type: VARCHAR(191)}
              - column: {name: tipo_canal, type: VARCHAR(100)}
              - column: {name: es_leida, type: BOOLEAN, defaultValueBoolean: false, constraints: {nullable: false}}
              - column: {name: creado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
        - createIndex: {schemaName: producto, tableName: tbl_notificaciones, indexName: idx_notificaciones_usuario_id, columns: [{column: {name: usuario_id}}]}
        - createIndex: {schemaName: producto, tableName: tbl_notificaciones, indexName: idx_notificaciones_tarea_id, columns: [{column: {name: tarea_id}}]}
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_notificaciones}
