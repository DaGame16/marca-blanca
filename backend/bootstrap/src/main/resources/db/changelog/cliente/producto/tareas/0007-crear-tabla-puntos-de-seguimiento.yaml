databaseChangeLog:
  - changeSet:
      id: producto-tareas-0007-crear-tabla-puntos-de-seguimiento
      author: leidi
      comment: Rastro GPS de un tecnico durante una tarea.
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_puntos_de_seguimiento
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_puntos_de_seguimiento}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_puntos_de_seguimiento_uuid}}
              - column:
                  name: tarea_id
                  type: BIGINT
                  constraints: {foreignKeyName: fk_puntos_de_seguimiento_tarea, references: producto.tbl_tareas(id)}
              - column:
                  name: usuario_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_puntos_de_seguimiento_usuario, references: seguridad.tbl_usuarios(id)}
              - column: {name: latitud, type: DOUBLE PRECISION, constraints: {nullable: false}}
              - column: {name: longitud, type: DOUBLE PRECISION, constraints: {nullable: false}}
              - column: {name: precision_gps, type: DOUBLE PRECISION}
              - column: {name: velocidad, type: DOUBLE PRECISION}
              - column: {name: registrado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
        - createIndex:
            schemaName: producto
            tableName: tbl_puntos_de_seguimiento
            indexName: idx_puntos_de_seguimiento_usuario_registrado
            columns: [{column: {name: usuario_id}}, {column: {name: registrado_en}}]
        - createIndex: {schemaName: producto, tableName: tbl_puntos_de_seguimiento, indexName: idx_puntos_de_seguimiento_tarea_id, columns: [{column: {name: tarea_id}}]}
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_puntos_de_seguimiento}
