databaseChangeLog:
  - changeSet:
      id: 0015-omnicanal-crear-tabla-canales-de-chat
      author: leidi
      comment: Canales de chat interno del equipo. Sin empresaId.
      changes:
        - createTable:
            schemaName: omnicanal
            tableName: tbl_canales_de_chat
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_canales_de_chat
              - column:
                  name: uuid
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_canales_de_chat_uuid
              - column:
                  name: tipo
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: nombre
                  type: VARCHAR(150)
              - column:
                  name: filtro_de_rol
                  type: VARCHAR(100)
              - column:
                  name: creado_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            schemaName: omnicanal
            tableName: tbl_canales_de_chat
