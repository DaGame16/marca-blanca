databaseChangeLog:
  - changeSet:
      id: producto-catalogos-0001-crear-tabla-unidades-de-medida
      author: leidi
      comment: Catalogo de unidades de medida. Sin empresaId; codigo unico por base.
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_unidades_de_medida
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_unidades_de_medida}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_unidades_de_medida_uuid}}
              - column: {name: codigo, type: VARCHAR(50), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_unidades_de_medida_codigo}}
              - column: {name: nombre, type: VARCHAR(120), constraints: {nullable: false}}
              - column: {name: es_activa, type: BOOLEAN, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: creado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
              - column: {name: actualizado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_unidades_de_medida}
