databaseChangeLog:
  - changeSet:
      id: producto-0028-crear-tabla-material-asignado-a-tecnico
      author: leidi
      comment: Material en poder de un tecnico. Sin empresaId; unico por (usuario, material).
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_material_asignado_a_tecnico
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_material_asignado_a_tecnico}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_material_asignado_a_tecnico_uuid}}
              - column:
                  name: usuario_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_material_asignado_a_tecnico_usuario, references: seguridad.tbl_usuarios(id)}
              - column:
                  name: producto_id
                  type: BIGINT
                  constraints: {foreignKeyName: fk_material_asignado_a_tecnico_producto, references: producto.tbl_productos(id)}
              - column: {name: material, type: VARCHAR(191), constraints: {nullable: false}}
              - column: {name: cantidad, type: DOUBLE PRECISION, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: metros, type: DOUBLE PRECISION, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: creado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
              - column: {name: actualizado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
        - addUniqueConstraint:
            schemaName: producto
            tableName: tbl_material_asignado_a_tecnico
            columnNames: usuario_id, material
            constraintName: uq_material_asignado_a_tecnico_par
        - createIndex: {schemaName: producto, tableName: tbl_material_asignado_a_tecnico, indexName: idx_material_asignado_a_tecnico_producto_id, columns: [{column: {name: producto_id}}]}
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_material_asignado_a_tecnico}
