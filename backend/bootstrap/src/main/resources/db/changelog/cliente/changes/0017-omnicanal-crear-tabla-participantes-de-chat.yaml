databaseChangeLog:
  - changeSet:
      id: 0017-omnicanal-crear-tabla-participantes-de-chat
      author: leidi
      comment: Participantes de cada canal de chat. Unico por (canal, usuario).
      changes:
        - createTable:
            schemaName: omnicanal
            tableName: tbl_participantes_de_chat
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_participantes_de_chat
              - column:
                  name: uuid
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_participantes_de_chat_uuid
              - column:
                  name: canal_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_participantes_de_chat_canal
                    references: omnicanal.tbl_canales_de_chat(id)
              - column:
                  name: usuario_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_participantes_de_chat_usuario
                    references: seguridad.tbl_usuarios(id)
              - column:
                  name: ultima_lectura_en
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: oculto_en
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: limpiado_en
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: unido_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            schemaName: omnicanal
            tableName: tbl_participantes_de_chat
            columnNames: canal_id, usuario_id
            constraintName: uq_participantes_de_chat_par
        - createIndex:
            schemaName: omnicanal
            tableName: tbl_participantes_de_chat
            indexName: idx_participantes_de_chat_usuario_id
            columns:
              - column:
                  name: usuario_id
      rollback:
        - dropTable:
            schemaName: omnicanal
            tableName: tbl_participantes_de_chat
