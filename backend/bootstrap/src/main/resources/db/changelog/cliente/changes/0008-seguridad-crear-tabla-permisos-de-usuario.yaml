databaseChangeLog:
  - changeSet:
      id: 0008-seguridad-crear-tabla-permisos-de-usuario
      author: leidi
      comment: Ajuste individual de permisos por usuario. es_concedido = true concede, false revoca.
      changes:
        - createTable:
            schemaName: seguridad
            tableName: TBL_permisos_de_usuario
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_permisos_de_usuario
              - column:
                  name: uuid
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: UQ_permisos_de_usuario_uuid
              - column:
                  name: usuario_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_permisos_de_usuario_usuario
                    references: seguridad.TBL_usuarios(id)
              - column:
                  name: permiso_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_permisos_de_usuario_permiso
                    references: seguridad.TBL_permisos(id)
              - column:
                  name: es_concedido
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: asignado_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            schemaName: seguridad
            tableName: TBL_permisos_de_usuario
            columnNames: usuario_id, permiso_id
            constraintName: UQ_permisos_de_usuario_par
        - createIndex:
            schemaName: seguridad
            tableName: TBL_permisos_de_usuario
            indexName: IDX_permisos_de_usuario_permiso_id
            columns:
              - column:
                  name: permiso_id
      rollback:
        - dropTable:
            schemaName: seguridad
            tableName: TBL_permisos_de_usuario