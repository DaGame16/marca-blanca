databaseChangeLog:
  - changeSet:
      id: producto-inventario-0008-crear-tabla-inventario-de-cuadrilla
      author: leidi
      comment: Items de inventario en poder de una cuadrilla. Unico por (cuadrilla, item).
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_inventario_de_cuadrilla
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_inventario_de_cuadrilla}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_inventario_de_cuadrilla_uuid}}
              - column:
                  name: cuadrilla_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_inventario_de_cuadrilla_cuadrilla, references: producto.tbl_cuadrillas(id)}
              - column:
                  name: item_inventario_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_inventario_de_cuadrilla_item, references: producto.tbl_items_de_inventario(id)}
              - column:
                  name: actualizado_por_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_inventario_de_cuadrilla_actualizado_por, references: seguridad.tbl_usuarios(id)}
              - column: {name: cantidad, type: INTEGER, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: consumido, type: INTEGER, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: recibido_en, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: actualizado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
        - addUniqueConstraint:
            schemaName: producto
            tableName: tbl_inventario_de_cuadrilla
            columnNames: cuadrilla_id, item_inventario_id
            constraintName: uq_inventario_de_cuadrilla_par
        - createIndex: {schemaName: producto, tableName: tbl_inventario_de_cuadrilla, indexName: idx_inventario_de_cuadrilla_item_inventario_id, columns: [{column: {name: item_inventario_id}}]}
        - createIndex: {schemaName: producto, tableName: tbl_inventario_de_cuadrilla, indexName: idx_inventario_de_cuadrilla_actualizado_por_id, columns: [{column: {name: actualizado_por_id}}]}
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_inventario_de_cuadrilla}
