databaseChangeLog:
  - changeSet:
      id: seguridad-0013-crear-tabla-consentimientos-de-datos
      author: leidi
      comment: Consentimientos de tratamiento de datos por usuario (Ley 1581). Dato legal vigente, se migra como dato vivo.
      changes:
        - createTable:
            schemaName: seguridad
            tableName: tbl_consentimientos_de_datos
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_consentimientos_de_datos}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_consentimientos_de_datos_uuid}}
              - column:
                  name: usuario_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_consentimientos_de_datos_usuario, references: seguridad.tbl_usuarios(id)}
              - column: {name: version_politica, type: VARCHAR(50), constraints: {nullable: false}}
              - column: {name: direccion_ip, type: INET}
              - column: {name: agente_usuario, type: VARCHAR(500)}
              - column: {name: aceptado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
        - createIndex: {schemaName: seguridad, tableName: tbl_consentimientos_de_datos, indexName: idx_consentimientos_de_datos_usuario_id, columns: [{column: {name: usuario_id}}]}
      rollback:
        - dropTable: {schemaName: seguridad, tableName: tbl_consentimientos_de_datos}
