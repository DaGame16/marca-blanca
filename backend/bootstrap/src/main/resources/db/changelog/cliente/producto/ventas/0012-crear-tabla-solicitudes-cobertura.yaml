databaseChangeLog:
  - changeSet:
      id: producto-ventas-0012-crear-tabla-solicitudes-cobertura
      author: leidi
      comment: Solicitudes de cobertura de servicio. Sin empresaId; ticket_validacion unico por base.
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_solicitudes_cobertura
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_solicitudes_cobertura}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_solicitudes_cobertura_uuid}}
              - column: {name: nombre, type: VARCHAR(191), constraints: {nullable: false}}
              - column: {name: telefono, type: VARCHAR(100), constraints: {nullable: false}}
              - column: {name: direccion, type: VARCHAR(255), constraints: {nullable: false}}
              - column: {name: barrio, type: VARCHAR(120)}
              - column: {name: municipio, type: VARCHAR(120), constraints: {nullable: false}}
              - column: {name: estado, type: VARCHAR(50), defaultValue: "Sin cobertura", constraints: {nullable: false}}
              - column: {name: ticket_validacion, type: VARCHAR(120), constraints: {unique: true, uniqueConstraintName: uq_solicitudes_cobertura_ticket}}
              - column: {name: creado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
              - column: {name: actualizado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
        - createIndex: {schemaName: producto, tableName: tbl_solicitudes_cobertura, indexName: idx_solicitudes_cobertura_municipio, columns: [{column: {name: municipio}}]}
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_solicitudes_cobertura}
