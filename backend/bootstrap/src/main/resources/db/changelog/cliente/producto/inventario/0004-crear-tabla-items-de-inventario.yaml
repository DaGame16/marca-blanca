databaseChangeLog:
  - changeSet:
      id: producto-inventario-0004-crear-tabla-items-de-inventario
      author: leidi
      comment: Inventario general (distinto de stock_de_producto). Sin empresaId; sku unico por base.
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_items_de_inventario
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_items_de_inventario}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_items_de_inventario_uuid}}
              - column: {name: nombre, type: VARCHAR(191), constraints: {nullable: false}}
              - column: {name: sku, type: VARCHAR(120), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_items_de_inventario_sku}}
              - column: {name: cantidad, type: INTEGER, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: ubicacion, type: VARCHAR(191)}
              - column: {name: creado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
              - column: {name: actualizado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_items_de_inventario}
