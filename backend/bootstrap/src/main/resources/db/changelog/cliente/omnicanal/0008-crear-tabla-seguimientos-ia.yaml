databaseChangeLog:
  - changeSet:
      id: 0022-omnicanal-crear-tabla-seguimientos-ia
      author: leidi
      comment: Seguimientos generados por IA sobre un contacto. cedula es texto libre (no FK). tarea_id sin FK hasta que exista el modulo producto.
      changes:
        - createTable:
            schemaName: omnicanal
            tableName: tbl_seguimientos_ia
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_seguimientos_ia
              - column:
                  name: uuid
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_seguimientos_ia_uuid
              - column:
                  name: cedula
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: celular
                  type: VARCHAR(100)
              - column:
                  name: descripcion
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: conversacion
                  type: TEXT
              - column:
                  name: importancia
                  type: VARCHAR(50)
              - column:
                  name: estado
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: area
                  type: VARCHAR(100)
              - column:
                  name: es_convertido_en_ticket
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: tarea_id
                  type: BIGINT
              - column:
                  name: id_solicitud
                  type: INTEGER
                  constraints:
                    unique: true
                    uniqueConstraintName: uq_seguimientos_ia_id_solicitud
              - column:
                  name: creado_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: actualizado_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: omnicanal
            tableName: tbl_seguimientos_ia
            indexName: idx_seguimientos_ia_tarea_id
            columns:
              - column:
                  name: tarea_id
      rollback:
        - dropTable:
            schemaName: omnicanal
            tableName: tbl_seguimientos_ia
