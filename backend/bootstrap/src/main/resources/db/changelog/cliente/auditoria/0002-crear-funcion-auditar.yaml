databaseChangeLog:
  - changeSet:
      id: auditoria-0002-crear-funcion-auditar
      author: leidi
      comment: Funcion de trigger que registra cada INSERT/UPDATE/DELETE en plataforma.tbl_auditoria. Se puede silenciar en una transaccion con SET LOCAL plataforma.auditoria_activa='off' (lo usa la migracion).
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION plataforma.fn_auditar() RETURNS trigger
              LANGUAGE plpgsql SECURITY DEFINER SET search_path = plataforma, pg_temp AS $$
              DECLARE
                v_ant jsonb; v_nue jsonb; v_id bigint; v_uuid uuid; v_app bigint;
              BEGIN
                IF current_setting('plataforma.auditoria_activa', true) = 'off' THEN
                  RETURN NULL;
                END IF;
                IF (TG_OP = 'DELETE') THEN
                  v_ant := to_jsonb(OLD);
                ELSIF (TG_OP = 'UPDATE') THEN
                  v_ant := to_jsonb(OLD); v_nue := to_jsonb(NEW);
                ELSE
                  v_nue := to_jsonb(NEW);
                END IF;
                v_id   := (COALESCE(v_nue, v_ant) ->> 'id')::bigint;
                v_uuid := (COALESCE(v_nue, v_ant) ->> 'uuid')::uuid;
                BEGIN
                  v_app := nullif(current_setting('plataforma.usuario_app_id', true), '')::bigint;
                EXCEPTION WHEN others THEN
                  v_app := NULL;
                END;
                INSERT INTO plataforma.tbl_auditoria
                  (esquema, tabla, operacion, registro_id, registro_uuid, datos_anteriores, datos_nuevos, usuario_bd, usuario_app_id, txid)
                VALUES
                  (TG_TABLE_SCHEMA, TG_TABLE_NAME, TG_OP, v_id, v_uuid, v_ant, v_nue, current_user, v_app, txid_current());
                RETURN NULL;
              END;
              $$;
      rollback:
        - sql: {sql: "DROP FUNCTION IF EXISTS plataforma.fn_auditar()"}
