databaseChangeLog:
  - changeSet:
      id: 0006-seguridad-crear-tabla-usuarios-roles
      author: leidi
      comment: Pivote usuario <-> rol (M:N). Reemplaza al usuarios.rolId del sistema viejo.
      changes:
        - createTable:
            schemaName: seguridad
            tableName: TBL_usuarios_roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_usuarios_roles
              - column:
                  name: uuid
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: UQ_usuarios_roles_uuid
              - column:
                  name: usuario_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_usuarios_roles_usuario
                    references: seguridad.TBL_usuarios(id)
              - column:
                  name: rol_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_usuarios_roles_rol
                    references: seguridad.TBL_roles(id)
              - column:
                  name: asignado_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            schemaName: seguridad
            tableName: TBL_usuarios_roles
            columnNames: usuario_id, rol_id
            constraintName: UQ_usuarios_roles_par
        - createIndex:
            schemaName: seguridad
            tableName: TBL_usuarios_roles
            indexName: IDX_usuarios_roles_rol_id
            columns:
              - column:
                  name: rol_id
      rollback:
        - dropTable:
            schemaName: seguridad
            tableName: TBL_usuarios_roles