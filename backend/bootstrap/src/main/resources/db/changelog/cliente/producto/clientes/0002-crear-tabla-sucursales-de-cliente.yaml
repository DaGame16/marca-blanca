databaseChangeLog:
  - changeSet:
      id: producto-clientes-0002-crear-tabla-sucursales-de-cliente
      author: leidi
      comment: Sucursales/contratos de un cliente. Unico por (cliente, id_sucursal_sigma). idcontrato es id externo (Sigma), no FK.
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_sucursales_de_cliente
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_sucursales_de_cliente}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_sucursales_de_cliente_uuid}}
              - column:
                  name: cliente_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_sucursales_de_cliente_cliente, references: producto.tbl_clientes(id)}
              - column: {name: id_sucursal_sigma, type: INTEGER, constraints: {nullable: false}}
              - column: {name: id_contrato_sigma, type: INTEGER}
              - column: {name: direccion, type: VARCHAR(255)}
              - column: {name: barrio, type: VARCHAR(120)}
              - column: {name: municipio, type: VARCHAR(120)}
              - column: {name: departamento, type: VARCHAR(120)}
              - column: {name: plan, type: VARCHAR(120)}
              - column: {name: movil, type: VARCHAR(100)}
              - column: {name: serial_ont, type: VARCHAR(120)}
              - column: {name: puerto_ont, type: VARCHAR(120)}
              - column: {name: estatus, type: VARCHAR(50)}
              - column: {name: creado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
              - column: {name: actualizado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
        - addUniqueConstraint:
            schemaName: producto
            tableName: tbl_sucursales_de_cliente
            columnNames: cliente_id, id_sucursal_sigma
            constraintName: uq_sucursales_de_cliente_par
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_sucursales_de_cliente}
