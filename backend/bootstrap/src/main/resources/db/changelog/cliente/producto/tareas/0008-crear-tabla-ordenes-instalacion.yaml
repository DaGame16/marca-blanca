databaseChangeLog:
  - changeSet:
      id: producto-tareas-0008-crear-tabla-ordenes-instalacion
      author: leidi
      comment: Ordenes de instalacion (origen de ventas). Sin empresaId; identificacion unica por base. url_imagenes_* (JSON) como JSONB. id_proceso_venta es un id externo.
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_ordenes_instalacion
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_ordenes_instalacion}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_ordenes_instalacion_uuid}}
              - column: {name: identificacion, type: INTEGER, constraints: {nullable: false, unique: true, uniqueConstraintName: uq_ordenes_instalacion_identificacion}}
              - column: {name: id_proceso_venta_externo, type: INTEGER, constraints: {unique: true, uniqueConstraintName: uq_ordenes_instalacion_id_proceso_venta}}
              - column: {name: ticket_instalacion, type: VARCHAR(120), constraints: {unique: true, uniqueConstraintName: uq_ordenes_instalacion_ticket}}
              - column: {name: nombre_cliente, type: VARCHAR(191), constraints: {nullable: false}}
              - column: {name: direccion, type: VARCHAR(255), constraints: {nullable: false}}
              - column: {name: movil, type: VARCHAR(100), constraints: {nullable: false}}
              - column: {name: email, type: VARCHAR(254)}
              - column: {name: plan, type: VARCHAR(120), constraints: {nullable: false}}
              - column: {name: departamento, type: VARCHAR(120), constraints: {nullable: false}}
              - column: {name: ciudad, type: VARCHAR(120), constraints: {nullable: false}}
              - column: {name: barrio, type: VARCHAR(120)}
              - column: {name: dpto_codigo, type: VARCHAR(10)}
              - column: {name: mun_codigo, type: VARCHAR(10)}
              - column: {name: link_pago, type: VARCHAR(500)}
              - column: {name: url_imagenes_identificacion, type: JSONB}
              - column: {name: url_imagenes_recibo_publico, type: JSONB}
              - column: {name: estado, type: VARCHAR(50), defaultValue: Pendiente, constraints: {nullable: false}}
              - column: {name: creado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
              - column: {name: actualizado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_ordenes_instalacion}
