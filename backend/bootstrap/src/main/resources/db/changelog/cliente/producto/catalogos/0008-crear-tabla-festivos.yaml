databaseChangeLog:
  - changeSet:
      id: producto-catalogos-0008-crear-tabla-festivos
      author: leidi
      comment: Calendario de festivos. Sin empresaId; fecha unica por base.
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_festivos
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_festivos}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_festivos_uuid}}
              - column: {name: fecha, type: DATE, constraints: {nullable: false, unique: true, uniqueConstraintName: uq_festivos_fecha}}
              - column: {name: nombre, type: VARCHAR(191), constraints: {nullable: false}}
              - column: {name: creado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_festivos}
