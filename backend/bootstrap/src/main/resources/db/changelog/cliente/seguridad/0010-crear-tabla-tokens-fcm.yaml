databaseChangeLog:
  - changeSet:
      id: 0011-seguridad-crear-tabla-tokens-fcm
      author: leidi
      comment: Tokens de notificaciones push (Firebase). token unico por base.
      changes:
        - createTable:
            schemaName: seguridad
            tableName: tbl_tokens_fcm
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_tokens_fcm
              - column:
                  name: uuid
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_tokens_fcm_uuid
              - column:
                  name: usuario_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_tokens_fcm_usuario
                    references: seguridad.tbl_usuarios(id)
              - column:
                  name: token
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_tokens_fcm_token
              - column:
                  name: dispositivo
                  type: VARCHAR(150)
              - column:
                  name: creado_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: seguridad
            tableName: tbl_tokens_fcm
            indexName: idx_tokens_fcm_usuario_id
            columns:
              - column:
                  name: usuario_id
      rollback:
        - dropTable:
            schemaName: seguridad
            tableName: tbl_tokens_fcm