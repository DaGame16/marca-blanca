databaseChangeLog:
  - changeSet:
      id: producto-0032-crear-tabla-items-de-compra
      author: leidi
      comment: Lineas de una orden de compra.
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_items_de_compra
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_items_de_compra}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_items_de_compra_uuid}}
              - column:
                  name: compra_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_items_de_compra_compra, references: producto.tbl_compras(id)}
              - column:
                  name: producto_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_items_de_compra_producto, references: producto.tbl_productos(id)}
              - column: {name: cantidad_solicitada, type: "NUMERIC(18,4)", constraints: {nullable: false}}
              - column: {name: cantidad_recibida, type: "NUMERIC(18,4)", defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: costo_unitario, type: "NUMERIC(18,4)", constraints: {nullable: false}}
              - column: {name: creado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
        - createIndex: {schemaName: producto, tableName: tbl_items_de_compra, indexName: idx_items_de_compra_compra_id, columns: [{column: {name: compra_id}}]}
        - createIndex: {schemaName: producto, tableName: tbl_items_de_compra, indexName: idx_items_de_compra_producto_id, columns: [{column: {name: producto_id}}]}
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_items_de_compra}
