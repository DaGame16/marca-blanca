databaseChangeLog:
  - changeSet:
      id: producto-ventas-0002-crear-tabla-procesos-de-venta
      author: leidi
      comment: Procesos de venta importados de un sistema externo. Sin empresaId; id_proceso_venta_externo unico por base.
      changes:
        - createTable:
            schemaName: producto
            tableName: tbl_procesos_de_venta
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_procesos_de_venta}}
              - column: {name: uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_procesos_de_venta_uuid}}
              - column: {name: id_proceso_venta_externo, type: INTEGER, constraints: {nullable: false, unique: true, uniqueConstraintName: uq_procesos_de_venta_externo}}
              - column: {name: id_sucursal_sigma, type: INTEGER, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: nit, type: VARCHAR(50), constraints: {nullable: false}}
              - column: {name: nombre_cliente, type: VARCHAR(191)}
              - column: {name: direccion, type: VARCHAR(255)}
              - column: {name: movil, type: VARCHAR(100)}
              - column: {name: correo, type: VARCHAR(254)}
              - column: {name: plan, type: VARCHAR(120)}
              - column: {name: departamento, type: VARCHAR(120)}
              - column: {name: ciudad, type: VARCHAR(120)}
              - column: {name: nombre_barrio, type: VARCHAR(120)}
              - column: {name: estado, type: VARCHAR(100)}
              - column: {name: proceso, type: VARCHAR(191)}
              - column: {name: latitud, type: DOUBLE PRECISION}
              - column: {name: longitud, type: DOUBLE PRECISION}
              - column: {name: creado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
              - column: {name: actualizado_en, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
        - createIndex: {schemaName: producto, tableName: tbl_procesos_de_venta, indexName: idx_procesos_de_venta_nit, columns: [{column: {name: nit}}]}
      rollback:
        - dropTable: {schemaName: producto, tableName: tbl_procesos_de_venta}
