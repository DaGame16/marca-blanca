databaseChangeLog:
  - changeSet:
      id: 0016-omnicanal-crear-tabla-mensajes-de-chat
      author: leidi
      comment: Mensajes en canales de chat interno. FK a canal y a seguridad.tbl_usuarios (remitente).
      changes:
        - createTable:
            schemaName: omnicanal
            tableName: tbl_mensajes_de_chat
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_mensajes_de_chat
              - column:
                  name: uuid
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_mensajes_de_chat_uuid
              - column:
                  name: canal_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_mensajes_de_chat_canal
                    references: omnicanal.tbl_canales_de_chat(id)
              - column:
                  name: remitente_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_mensajes_de_chat_remitente
                    references: seguridad.tbl_usuarios(id)
              - column:
                  name: contenido
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: editado_en
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: eliminado_en
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: creado_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: omnicanal
            tableName: tbl_mensajes_de_chat
            indexName: idx_mensajes_de_chat_canal_id
            columns:
              - column:
                  name: canal_id
        - createIndex:
            schemaName: omnicanal
            tableName: tbl_mensajes_de_chat
            indexName: idx_mensajes_de_chat_remitente_id
            columns:
              - column:
                  name: remitente_id
      rollback:
        - dropTable:
            schemaName: omnicanal
            tableName: tbl_mensajes_de_chat
