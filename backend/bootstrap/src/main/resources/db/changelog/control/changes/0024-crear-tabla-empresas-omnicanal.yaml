databaseChangeLog:
  - changeSet:
      id: 0024-crear-tabla-empresas-omnicanal
      author: leidi
      comment: >
        Directorio de ruteo del webhook de LIWA: mapea webhook_secret a empresa.
        Es lo unico de omnicanal que vive en la base de control, porque el webhook
        llega sin JWT ni subdominio y la resolucion de tenant necesita una tabla
        transversal (mismo rol que tbl_empresa_conexiones). El resto de la config
        de omnicanal (token LIWA, flags de IA, perfil de analisis) vive en el
        schema omnicanal de la base de cada empresa. Los privilegios de
        guajiranet_app / guajiranet_lectura los hereda del ALTER DEFAULT
        PRIVILEGES del changeset 0008.
      changes:
        - createTable:
            schemaName: plataforma
            tableName: tbl_empresas_omnicanal
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: {primaryKey: true, primaryKeyName: pk_empresas_omnicanal}
              - column:
                  name: uuid
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints: {nullable: false, unique: true, uniqueConstraintName: uq_empresas_omnicanal_uuid}
              - column:
                  name: empresa_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_empresas_omnicanal_empresa
                    foreignKeyName: fk_empresas_omnicanal_empresa
                    references: plataforma.tbl_empresas(id)
              - column:
                  name: webhook_secret
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_empresas_omnicanal_webhook_secret
              - column:
                  name: creado_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints: {nullable: false}
              - column:
                  name: actualizado_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints: {nullable: false}
      rollback:
        - dropTable:
            schemaName: plataforma
            tableName: tbl_empresas_omnicanal
