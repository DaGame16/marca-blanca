databaseChangeLog:
  - changeSet:
      id: 0016-crear-tabla-config-correo
      author: leidi
      comment: Config SMTP de la plataforma marca blanca (correos de bienvenida y notificaciones a clientes). secreto_ref apunta al vault.
      changes:
        - createTable:
            schemaName: plataforma
            tableName: tbl_config_correo
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: {primaryKey: true, primaryKeyName: pk_config_correo}
              - column:
                  name: uuid
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints: {nullable: false, unique: true, uniqueConstraintName: uq_config_correo_uuid}
              - column: {name: remitente_nombre, type: VARCHAR(150)}
              - column:
                  name: remitente_correo
                  type: VARCHAR(254)
                  constraints: {nullable: false}
              - column: {name: responder_a, type: VARCHAR(254)}
              - column:
                  name: host
                  type: VARCHAR(255)
                  constraints: {nullable: false}
              - column:
                  name: puerto
                  type: INTEGER
                  defaultValueNumeric: 587
                  constraints: {nullable: false}
              - column: {name: usuario, type: VARCHAR(255)}
              - column: {name: secreto_ref, type: VARCHAR(400)}
              - column:
                  name: seguridad
                  type: VARCHAR(20)
                  defaultValue: starttls
                  constraints: {nullable: false}
              - column:
                  name: es_activa
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: {nullable: false}
              - column:
                  name: creado_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints: {nullable: false}
              - column:
                  name: actualizado_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints: {nullable: false}
        - sql:
            sql: >
              ALTER TABLE plataforma.tbl_config_correo
              ADD CONSTRAINT ck_config_correo_seguridad
              CHECK (seguridad IN ('ninguna', 'starttls', 'ssl'))
        - sql:
            comment: Como maximo una config de correo activa.
            sql: >
              CREATE UNIQUE INDEX uq_config_correo_activa
              ON plataforma.tbl_config_correo (es_activa) WHERE es_activa
      rollback:
        - dropTable:
            schemaName: plataforma
            tableName: tbl_config_correo