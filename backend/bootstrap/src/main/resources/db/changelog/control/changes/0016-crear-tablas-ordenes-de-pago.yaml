databaseChangeLog:
  - changeSet:
      id: 0016-crear-tablas-ordenes-de-pago
      author: leidi
      comment: Orden de pago del onboarding + sus items (snapshot de precios). Agnostica a la pasarela; el webhook la mueve a 'aprobada' y ahi se dispara el aprovisionamiento.
      changes:
        - createTable:
            schemaName: plataforma
            tableName: tbl_ordenes_pago
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: {primaryKey: true, primaryKeyName: pk_ordenes_pago}
              - column:
                  name: uuid
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints: {nullable: false, unique: true, uniqueConstraintName: uq_ordenes_pago_uuid}
              - column:
                  name: empresa_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ordenes_pago_empresa
                    references: plataforma.tbl_empresas(id)
              - column:
                  name: monto
                  type: NUMERIC(12, 2)
                  constraints: {nullable: false}
              - column:
                  name: moneda
                  type: VARCHAR(3)
                  defaultValue: COP
                  constraints: {nullable: false}
              - column:
                  name: estado
                  type: VARCHAR(20)
                  defaultValue: pendiente
                  constraints: {nullable: false}
              - column: {name: proveedor, type: VARCHAR(40)}
              - column: {name: referencia_externa, type: VARCHAR(200)}
              - column:
                  name: payload
                  type: JSONB
              - column:
                  name: creado_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints: {nullable: false}
              - column:
                  name: actualizado_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints: {nullable: false}
              - column: {name: pagada_en, type: TIMESTAMP WITH TIME ZONE}
        - sql:
            sql: >
              ALTER TABLE plataforma.tbl_ordenes_pago
              ADD CONSTRAINT ck_ordenes_pago_estado
              CHECK (estado IN ('pendiente', 'aprobada', 'rechazada', 'error', 'expirada'))
        - createIndex:
            schemaName: plataforma
            tableName: tbl_ordenes_pago
            indexName: idx_ordenes_pago_empresa_id
            columns: [{column: {name: empresa_id}}]
        - createIndex:
            schemaName: plataforma
            tableName: tbl_ordenes_pago
            indexName: idx_ordenes_pago_referencia_externa
            columns: [{column: {name: referencia_externa}}]
        - createTable:
            schemaName: plataforma
            tableName: tbl_ordenes_pago_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: {primaryKey: true, primaryKeyName: pk_ordenes_pago_items}
              - column:
                  name: orden_pago_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ordenes_pago_items_orden
                    references: plataforma.tbl_ordenes_pago(id)
              - column:
                  name: modulo_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ordenes_pago_items_modulo
                    references: plataforma.tbl_modulos(id)
              - column:
                  name: precio_unitario
                  type: NUMERIC(12, 2)
                  constraints: {nullable: false}
              - column:
                  name: moneda
                  type: VARCHAR(3)
                  defaultValue: COP
                  constraints: {nullable: false}
        - addUniqueConstraint:
            schemaName: plataforma
            tableName: tbl_ordenes_pago_items
            columnNames: orden_pago_id, modulo_id
            constraintName: uq_ordenes_pago_items_par
        - createIndex:
            schemaName: plataforma
            tableName: tbl_ordenes_pago_items
            indexName: idx_ordenes_pago_items_modulo_id
            columns: [{column: {name: modulo_id}}]
      rollback:
        - dropTable: {schemaName: plataforma, tableName: tbl_ordenes_pago_items}
        - dropTable: {schemaName: plataforma, tableName: tbl_ordenes_pago}