databaseChangeLog:
  - changeSet:
      id: 0003-crear-tabla-empresas-marca
      author: leidi
      comment: Marca blanca por empresa (1:1). Logo, colores, dominio propio.
      changes:
        - createTable:
            schemaName: plataforma
            tableName: tbl_empresas_marca
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_empresas_marca
              - column:
                  name: uuid
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_empresas_marca_uuid
              - column:
                  name: empresa_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_empresas_marca_empresa
                    foreignKeyName: fk_empresas_marca_empresa
                    references: plataforma.tbl_empresas(id)
              - column:
                  name: url_logo
                  type: VARCHAR(500)
              - column:
                  name: color_primario
                  type: VARCHAR(20)
              - column:
                  name: color_secundario
                  type: VARCHAR(20)
              - column:
                  name: dominio_propio
                  type: VARCHAR(191)
              - column:
                  name: creado_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: actualizado_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            schemaName: plataforma
            tableName: tbl_empresas_marca