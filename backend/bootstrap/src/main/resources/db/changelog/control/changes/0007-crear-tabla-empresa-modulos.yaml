databaseChangeLog:
  - changeSet:
      id: 0007-crear-tabla-empresa-modulos
      author: leidi
      comment: Modulos activos por empresa (activacion logica, no estructura).
      changes:
        - createTable:
            schemaName: plataforma
            tableName: tbl_empresa_modulos
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_empresa_modulos
              - column:
                  name: uuid
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_empresa_modulos_uuid
              - column:
                  name: empresa_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_empresa_modulos_empresa
                    references: plataforma.tbl_empresas(id)
              - column:
                  name: modulo_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_empresa_modulos_modulo
                    references: plataforma.tbl_modulos(id)
              - column:
                  name: es_activo
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: activado_en
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: creado_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: actualizado_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            schemaName: plataforma
            tableName: tbl_empresa_modulos
            columnNames: empresa_id, modulo_id
            constraintName: uq_empresa_modulos_par
        - createIndex:
            schemaName: plataforma
            tableName: tbl_empresa_modulos
            indexName: idx_empresa_modulos_modulo_id
            columns:
              - column:
                  name: modulo_id
      rollback:
        - dropTable:
            schemaName: plataforma
            tableName: tbl_empresa_modulos