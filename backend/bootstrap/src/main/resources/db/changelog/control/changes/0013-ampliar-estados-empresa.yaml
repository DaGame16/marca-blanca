databaseChangeLog:
  - changeSet:
      id: 0013-ampliar-estados-empresa
      author: leidi
      comment: Estados nuevos para el flujo con pago. borrador -> pendiente_pago -> pendiente_aprovisionamiento -> activa.
      changes:
        - sql:
            sql: ALTER TABLE plataforma.tbl_empresas DROP CONSTRAINT ck_empresas_estado
        - sql:
            sql: >
              ALTER TABLE plataforma.tbl_empresas
              ADD CONSTRAINT ck_empresas_estado
              CHECK (estado IN ('borrador', 'pendiente_aprovisionamiento',
              'activa', 'suspendida', 'inactiva'))
      rollback:
        - sql:
            sql: ALTER TABLE plataforma.tbl_empresas DROP CONSTRAINT ck_empresas_estado
        - sql:
            sql: >
              ALTER TABLE plataforma.tbl_empresas
              ADD CONSTRAINT ck_empresas_estado
              CHECK (estado IN ('pendiente_aprovisionamiento', 'activa', 'suspendida', 'inactiva'))