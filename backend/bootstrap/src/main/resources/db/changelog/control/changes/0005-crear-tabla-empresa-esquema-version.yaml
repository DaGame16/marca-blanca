databaseChangeLog:
  - changeSet:
      id: 0005-crear-tabla-empresa-esquema-version
      author: leidi
      comment: Audita que ninguna base de cliente quede desincronizada del changelog (seccion 2.1).
      changes:
        - createTable:
            schemaName: plataforma
            tableName: tbl_empresa_esquema_version
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_empresa_esquema_version
              - column:
                  name: uuid
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_empresa_esquema_version_uuid
              - column:
                  name: empresa_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_empresa_esquema_version_empresa
                    foreignKeyName: fk_empresa_esquema_version_empresa
                    references: plataforma.tbl_empresas(id)
              - column:
                  name: ultima_migracion_aplicada
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: aplicada_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            schemaName: plataforma
            tableName: tbl_empresa_esquema_version