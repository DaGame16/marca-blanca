databaseChangeLog:
  - changeSet:
      id: 0018-crear-tabla-operadores
      author: leidi
      comment: >
        Identidad de los operadores de la plataforma (consola de operacion). Vive
        en la base de control, separada de los usuarios de cada empresa. rol y
        es_contrasena_temporal en minusculas, como el resto de enums del esquema.
      changes:
        - createTable:
            schemaName: plataforma
            tableName: tbl_operadores
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_operadores
              - column:
                  name: correo
                  type: VARCHAR(254)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_operadores_correo
              - column:
                  name: nombre
                  type: VARCHAR(160)
                  constraints:
                    nullable: false
              - column:
                  name: hash_contrasena
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: rol
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: activo
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: es_contrasena_temporal
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: mfa_secret
                  type: VARCHAR(64)
              - column:
                  name: creado_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: actualizado_en
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            sql: >
              ALTER TABLE plataforma.tbl_operadores
              ADD CONSTRAINT ck_operadores_rol CHECK (rol IN ('super_admin', 'soporte'))
      rollback:
        - dropTable:
            schemaName: plataforma
            tableName: tbl_operadores
