# SonarQube self-hosted, para análisis estático de backend (Java) y frontend (Angular).
#
# Uso:
#   cd infra/docker/sonarqube
#   cp .env.example .env   # ajusta la contraseña de postgres
#   docker compose up -d
#
# Primer login: http://localhost:9000  (admin / admin, te pide cambiarla)
# Luego: My Account > Security > Generate Token  -> ese es SONAR_TOKEN

services:
  sonarqube:
    image: sonarqube:community
    container_name: mi-proyecto-sonarqube
    depends_on:
      - sonar-db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?define SONAR_DB_PASSWORD in .env}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    restart: unless-stopped

  sonar-db:
    image: postgres:16-alpine
    container_name: mi-proyecto-sonarqube-db
    environment:
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?define SONAR_DB_PASSWORD in .env}
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:
