# Levanta el proyecto completo (backend + frontend + Postgres de la app)
# con un solo comando:
#
#   docker compose up -d --build
#
# No reemplaza al compose de backend/bootstrap/compose.yaml (ese sigue
# sirviendo para levantar SOLO el Postgres, mas liviano para desarrollar
# el backend desde el IDE). Tampoco toca SonarQube: ese vive aparte en
# infra/docker/sonarqube, porque es una herramienta de analisis, no parte
# de lo que corre en produccion.

services:
  postgres:
    image: postgres:17
    container_name: marca-blanca-postgres
    environment:
      POSTGRES_DB: db_portal_guajiranet_control
      POSTGRES_USER: guajiranet_owner
      POSTGRES_PASSWORD: guajiranet_owner
    ports:
      - "5432:5432"
    volumes:
      - marca-blanca-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guajiranet_owner -d db_portal_guajiranet_control"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marca-blanca-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_portal_guajiranet_control
      SPRING_DATASOURCE_USERNAME: guajiranet_owner
      SPRING_DATASOURCE_PASSWORD: guajiranet_owner
      # En cualquier ambiente real esto se sobreescribe con un secreto de verdad.
      JWT_SECRET: ${JWT_SECRET:-solo-para-desarrollo-local-cambiar-siempre}
      # El pipeline de aprovisionamiento (modulo aprovisionamiento) abre conexiones
      # propias -- fuera de las unidades JPA -- para crear/clonar bases de cliente
      # y sembrar datos en ellas. Sus defaults apuntan a "localhost", que dentro de
      # este contenedor es el contenedor mismo, no el de Postgres: sin esto, el
      # aprovisionamiento se queda atascado reintentando ("Failed to obtain JDBC
      # Connection") o -- peor -- funciona a medias por resolverse por accidente.
      APROV_MANT_URL: jdbc:postgresql://postgres:5432/postgres
      APROV_MANT_USER: guajiranet_owner
      APROV_MANT_PASSWORD: guajiranet_owner
      APROV_CLIENTE_HOST: postgres
      APROV_CLIENTE_PUERTO: "5432"
      # Cifra/descifra la clave SMTP guardada en tbl_config_correo (ver
      # modulo correo, CifradorDeCorreo) -- es un secreto de INFRAESTRUCTURA,
      # no la clave de ningun proveedor de correo en particular: casi nunca
      # cambia. Las claves SMTP en si las administra un admin desde la
      # consola de operacion (/consola/correo), sin tocar el backend.
      APP_CORREO_CLAVE_MAESTRA: ${CORREO_CLAVE_MAESTRA:-solo-para-desarrollo-local-cambiar-siempre}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marca-blanca-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  marca-blanca-postgres-data:
